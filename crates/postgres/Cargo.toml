[package]
name = "postgres"
description = "Connecting to Postgres"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# `ToSql` writes into a `BytesMut` and neither the driver nor `postgres-types`
# re-exports the crate it comes from, so an impl outside the driver has to name
# it. Already in the graph underneath `tokio-postgres`.
bytes = "1.12.1"

# A pool rather than a connection is what a long-lived process needs, and this
# is the pool for this driver: `sqlx` bundles one, `tokio-postgres` does not.
deadpool-postgres = "0.14.1"
thiserror = "2.0.19"

# Only this crate builds against the driver; everyone else goes through it.
tokio-postgres = "0.7.18"
# What makes `sslmode` mean anything: with `NoTls` the driver answers
# `can_connect` false and hands `sslmode=prefer` a raw stream without ever
# sending `SSLRequest`. The wrapper promotes `prefer` to `require`. `ring`
# rather than `aws-lc-rs` for the provider — one
# crypto backend across this crate and `clickhouse-client`, and no cmake in the
# build — and `native-certs` so the roots are the host's, as libpq's are.
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = [
  "native-certs",
  "ring",
] }
# The `ClientConfig` the connector is built from, and the one place the provider
# is named. `ring` matches the feature above; enabling neither here would leave
# `builder()` panicking on a process with no default provider installed.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The host's trust store, read directly rather than through the connector's own
# `with_native_certs` — that one builds its `ClientConfig` from the process
# default provider, which is the resolution this crate declines to depend on.
rustls-native-certs = "0.8.5"
# The span a read is seen as. The driver opens none — it speaks `log` — so
# without this a trace stops at the edge of every Postgres call.
tracing = "0.1.44"

[dev-dependencies]
# Only the cases need a runtime; the crate itself starts none. `net`, `io-util`
# and `sync` are the stub server one case dials: a listener that answers the
# `SSLRequest` and reports back what the client sent next.
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync"] }
# Reading the span a read opens back out of a subscriber. The only copy of this
# in the workspace, because the two reads above are the only way to issue one.
tracing-subscriber = "0.3.23"

[lints]
workspace = true
