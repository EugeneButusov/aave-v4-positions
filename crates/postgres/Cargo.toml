[package]
name = "postgres"
description = "Connecting to Postgres"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# A pool rather than a connection is what a long-lived process needs, and this
# is the pool for this driver: `sqlx` bundles one, `tokio-postgres` does not.
deadpool-postgres = "0.14.1"
thiserror = "2.0.19"

# Only this crate builds against the driver; everyone else goes through it.
tokio-postgres = "0.7.18"
# The span a read is seen as. The driver opens none — it speaks `log` — so
# without this a trace stops at the edge of every Postgres call.
tracing = "0.1.44"

[dev-dependencies]
# Only the cases need a runtime; the crate itself starts none.
tokio = { version = "1.53.1", features = ["macros", "rt"] }
# Reading the span a read opens back out of a subscriber. The only copy of this
# in the workspace, because the two reads above are the only way to issue one.
tracing-subscriber = "0.3.23"

[lints]
workspace = true
