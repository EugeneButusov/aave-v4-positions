[package]
name = "aave-positions"
description = "The valuation arithmetic, transcribed from the contracts"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# `map` and `map-foldhash` are the other two defaults: hashbrown-backed
# `AddressHashMap` and friends, which nothing here names. `std` is what
# `thiserror`'s `Error` impl and the `Display` on these integers want.
alloy-primitives = { version = "1.6.1", default-features = false, features = ["std"] }
thiserror = "2.0.19"

[lints]
workspace = true
