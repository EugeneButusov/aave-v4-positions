[package]
name = "indexing"
description = "The indexer's own position, and the loop that advances it"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# `B256` for a block hash. Not a provider and not a transport — see the crate
# doc for why that distinction is load-bearing here rather than incidental.
alloy-primitives = { version = "1.6.1", default-features = false, features = ["std"] }
async-trait = "0.1.92"
# The twelve instruments. `metrics` alone — this crate records nothing else, and
# the scope name is the binary's to supply so the telemetry crate stays out of
# the graph here.
opentelemetry = { version = "0.31.0", default-features = false, features = ["metrics"] }
postgres.workspace = true
# The signal handed to a processor. Cooperative rather than dropping its future
# at whatever await point the cancellation lands on, which here is mid-write.
tokio-util = { version = "0.7.19", default-features = false }
# The `Row` a query hands back and the error it refuses with. `with-time-0_3`
# because `timestamptz` is read off one of those rows — a feature belongs to the
# crate that needs it, not to whoever happens to own the dependency.
tokio-postgres = { version = "0.7.18", features = ["with-time-0_3"] }
thiserror = "2.0.19"
# The one line the detector writes: a header that did not extend the one below
# it, which finality says cannot happen at or below the safe head.
tracing = { version = "0.1.42", default-features = false, features = ["std", "attributes"] }
# When the indexer last advanced, which reaches the wire as an ISO-8601 string.
time = "0.3.55"

# The loop sleeps, times itself and races its own drain. `time` so a case can
# take the test clock rather than a real one.
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "macros"] }

[dev-dependencies]
migrations.workspace = true
# An in-memory exporter, so the instrument inventory is read back rather than
# asserted from the source that declares it.
opentelemetry_sdk = { version = "0.31.0", features = ["testing"] }
refinery-core = { version = "0.9.2", features = ["tokio-postgres"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util"] }
# The span layer, so the iteration and processor spans are read back from an
# exporter rather than asserted from the source that opens them.
tracing-opentelemetry = "0.32.1"
tracing-subscriber = "0.3.23"

[lints]
workspace = true
