[package]
name = "indexing"
description = "The indexer's own position, and the loop that advances it"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# `B256` for a block hash. Not a provider and not a transport — see the crate
# doc for why that distinction is load-bearing here rather than incidental.
alloy-primitives = { version = "1.6.1", default-features = false, features = ["std"] }
async-trait = "0.1.92"
postgres.workspace = true
thiserror = "2.0.19"
# When the indexer last advanced, which reaches the wire as an ISO-8601 string.
time = "0.3.55"

[dev-dependencies]
migrations.workspace = true
refinery-core = { version = "0.9.2", features = ["tokio-postgres"] }
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
