[package]
name = "units"
description = "The identifiers and instants every crate here agrees on"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No `[dependencies]`, and that is the point. Every crate in the workspace may
# name these types, so anything they could depend on would be depended on by
# all of them — `aave-positions` reaches ClickHouse and `indexing` reaches
# Postgres, and neither may acquire the other's driver for a newtype.

[lints]
workspace = true
