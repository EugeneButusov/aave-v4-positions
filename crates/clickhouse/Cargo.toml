[package]
name = "clickhouse-client"
description = "The ClickHouse client this repository uses"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Only this crate builds against the driver; everyone else goes through it.
#
# `opentelemetry` is what makes the `clickhouse.query` span it already emits a
# proper client span: `db.system.name` and `otel.kind` on the way out, the error
# status recorded when a query fails, and `traceparent` put on the request so the
# server can be asked about the same trace. Nothing here calls into it — the
# driver reads the propagator `telemetry` sets.
#
# `rustls-tls-ring` and `rustls-tls-native-roots` rather than the `rustls-tls`
# bundle: that one pulls `aws-lc-rs` and Mozilla's baked-in root list, where
# `crates/postgres` uses `ring` and the host's roots. One crypto backend and one
# source of trust across both databases. Without either, an `https://` URL fails
# with a message naming the feature instead of connecting.
clickhouse = { version = "0.15.1", features = [
  "opentelemetry",
  "rustls-tls-native-roots",
  "rustls-tls-ring",
] }
# The driver's TLS-enabled default constructs its root store even for HTTP.
# Build the explicitly insecure client with an HTTP-only connector instead.
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
# The readiness error is ours, so that the driver's `Display` — which quotes the
# server's response verbatim — stays off an unauthenticated body.
thiserror = "2.0.19"
# Parsed here as well as at the environment edge because this crate owns the
# transport policy and can be called without either binary's config reader.
url = "2.5.8"

[dev-dependencies]
# Reading the driver's span back out of a subscriber, which is what tells the
# `opentelemetry` feature being on from it being off.
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
# `#[tokio::test]`. The driver pulls tokio in regardless; this only asks for the
# attribute and a current-thread runtime to hang it on.
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
