[package]
name = "telemetry"
description = "OTLP for traces, metrics and logs, and the subscriber that feeds them"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The API the exporters are built against, and the global registries a library
# writes through — `clickhouse`'s own spans read the propagator set here.
opentelemetry = "0.31.0"
# The three providers, the sampler and the resource. No `rt-tokio`: the batch
# processors run on threads of their own, so a library that pulled a runtime in
# would be taking a choice away from the binary.
opentelemetry_sdk = "0.31.0"
# `http-proto` because the collector this talks to is the one the Node service
# talks to, over the same `:4318`. **`default-features = false` is load-bearing**:
# the defaults include `reqwest-blocking-client`, which pulls reqwest and a TLS
# stack in to post a protobuf. `hyper-client` reuses the hyper axum already
# links. No `grpc-tonic`, which is the one path that puts a second tokio in the
# graph — `deny.toml` denies exactly that.
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = [
  "http-proto",
  "hyper-client",
  "trace",
  "metrics",
  "logs",
  "internal-logs",
] }
# The header map a caller's `traceparent` arrives in. Already in the tree
# through axum and hyper; naming it is what lets this crate spell it.
http = "1.5.0"
# `HttpClient`, implemented here rather than used as-is. See `provider.rs`.
opentelemetry-http = { version = "0.31.0", features = ["hyper"] }
# `service.name`, spelled by the specification rather than by us.
opentelemetry-semantic-conventions = "0.31.0"
# The bridge that turns a `tracing` event into an OTLP log record. stdout keeps
# the line it already emits; this is the second copy.
opentelemetry-appender-tracing = "0.31.1"
# The `HttpClient` impl is a trait method returning a future, which `async fn` in
# a trait still cannot be.
async-trait = "0.1.92"
# The runtime handle the exporters are handed. `rt` only: the binary owns the
# runtime, this crate borrows it.
tokio = { version = "1.53.1", features = ["rt"] }
tracing = "0.1.44"
# The layer that turns a `tracing` span into an OpenTelemetry one. Its 0.32 is
# the release built against `opentelemetry` 0.31.
tracing-opentelemetry = "0.32.1"
# `json` for the line a deployment reads, `registry` because three layers share
# one subscriber here where the formatter used to be alone.
tracing-subscriber = { version = "0.3.23", features = ["json"] }
thiserror = "2.0.19"

[dev-dependencies]
# `#[tokio::test]`, and a multi-threaded runtime because the exporters hand work
# back to it from a thread that is then blocked waiting for the answer.
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
