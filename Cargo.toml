[workspace]
# 3 for MSRV-aware resolution: `cargo update` respects rust-version rather than
# silently raising the floor.
resolver = "3"
members = ["bins/*", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
aave-positions = { path = "crates/aave-positions" }
clickhouse-client = { path = "crates/clickhouse" }
env = { path = "crates/env" }
indexing = { path = "crates/indexing" }
migrations = { path = "crates/migrations" }
ops = { path = "crates/ops" }
postgres = { path = "crates/postgres" }
prices = { path = "crates/prices" }
telemetry = { path = "crates/telemetry" }
token-metadata = { path = "crates/token-metadata" }

[workspace.lints.rust]
unsafe_code = "forbid"

# A binary crate cannot be depended on, so every `pub` in one claims a reach it
# does not have.
unreachable_pub = "deny"

# Cast lints are pedantic's, allow-by-default: a lossy cast is this language's
# silent wrong number.
#
# Absent on purpose: `arithmetic_side_effects` belongs on the valuation crate,
# not every loop counter; `indexing_slicing` reads like a bounds-check lint and
# is not one, since an out-of-range index panics rather than yielding nothing.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
