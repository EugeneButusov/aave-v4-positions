[package]
name = "migrate"
description = "Applies both schemas, then exits. The only thing in this workspace that issues DDL"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clickhouse-client.workspace = true
postgres.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# Only this crate uses these, so the workspace has no version to agree on.
# Each names a feature nothing else here would turn on: `tokio-postgres` is what
# supplies refinery's Postgres backend, and `parsing` is what
# `OffsetDateTime::parse` needs — refinery-core takes one in `Migration::applied`
# and re-exports no `time`, so the crate and its feature are both ours to pick.
async-trait = "0.1"
refinery-core = { version = "0.9.2", default-features = false, features = ["tokio-postgres"] }
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
# Only `completeness`, which is `#[cfg(test)]`, defines an error type.
thiserror.workspace = true

[lints]
workspace = true
