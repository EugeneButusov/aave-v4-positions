[package]
name = "migrate"
description = "Applies both schemas, then exits. The only thing in this workspace that issues DDL"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clickhouse-client.workspace = true
postgres.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# Only this crate uses these, so the workspace has no version to agree on.
# `time` is here because refinery takes an `OffsetDateTime` in `Migration::applied`
# without re-exporting the crate; `parsing` is the feature that call needs, and
# leaving it off would mean compiling on refinery's choice of it.
async-trait = "0.1"
refinery = { version = "0.9.2", default-features = false, features = ["tokio-postgres"] }
refinery-core = { version = "0.9.2", default-features = false }
time = { version = "0.3", features = ["parsing"] }

[lints]
workspace = true
