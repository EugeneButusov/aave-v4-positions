[package]
name = "api"
description = "Serves the read API"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aave-positions.workspace = true
clickhouse-client.workspace = true
env.workspace = true
# The read-only view of the cursor row, and nothing else from that crate. The
# boundary rule is no chain and no socket, which its own doc argues this side of.
indexing.workspace = true
ops.workspace = true
postgres.workspace = true
prices.workspace = true
token-metadata.workspace = true

# `Address` and the two 256-bit integers the stores hand back. Already linked
# through `aave-positions`; naming it here is what lets this crate spell the
# types in its own signatures.
alloy-primitives = { version = "1.6.1", default-features = false, features = ["std"] }
# The four ports are held as `Box<dyn _>`, which `async fn` in a trait still
# cannot be. Also what the test doubles in here implement.
async-trait = "0.1.92"
axum = "0.8.9"
# A cursor's payload and its tag, both unpadded URL-safe. Already in the tree
# through the drivers, so naming it costs no compilation.
base64 = "0.22.1"
# The query string as the pairs it is. Named rather than reached through
# `axum::extract::Query`, whose rejection is a shape of its own: this endpoint
# reports every bad parameter at once and has to see the unrecognised ones,
# neither of which survives a deserialize into a struct.
form_urlencoded = "1.2.2"
# The cursor's signature. `sha2` is the digest behind it and `subtle` is the
# comparison — a tag checked with `==` leaks its prefix through timing.
hmac = "0.12.1"
sha2 = "0.10.9"
subtle = "2.6.1"
# Everything this service puts on the wire — the error envelope and the page.
# `axum::Json` serialises them; this names the derive.
serde = { version = "1.0.229", features = ["derive"] }
# `macros` for `#[tokio::main]` and the `join!` the readiness probe uses, `net`
# for the listener, `rt-multi-thread` because this one serves concurrently
# where `migrate` walks a list, and `sync` for the test that stands in for a
# signal.
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
thiserror = "2.0.19"
# The `timestamptz` the two Postgres reads hand over, and the three wire clocks
# it becomes. Neither feature is a default: `serde` carries the `rfc3339` module
# the three fields name, and `formatting` is what that module's `serialize` half
# is gated on.
time = { version = "0.3.55", features = ["formatting", "serde"] }
# `ServiceBuilder`, so the two request-id layers are ordered where a reader can
# see it rather than by the direction `Router::layer` happens to compose.
tower = { version = "0.5.3", features = ["util"] }
# `fs` for the three Swagger UI files, which are served off disk rather than
# embedded: `utoipa-swagger-ui` bakes 11 MB into the binary to ship the 2 MB a
# page actually loads, and most of the rest is source maps.
tower-http = { version = "0.7.0", features = ["catch-panic", "fs", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
# The document is generated from the handler and the view types rather than
# written beside them, so a route or a field that moves takes the contract with
# it. `time` because three fields are `OffsetDateTime`; `preserve_order` because
# `errors::json` and `views` both say field order is contractual and the default
# map alphabetises it; `yaml` because `/docs/openapi.yaml` is part of the surface
# this replaces. No `axum_extras`: the document is byte-identical without it, and
# it pulls `regex` into the graph.
utoipa = { version = "5.5.0", features = ["preserve_order", "time", "yaml"] }
# Registers a route with its documentation in one call, so neither can drift —
# and rewrites the documented path when the router is nested, so the document
# describes what this deployment serves rather than what a literal claims.
utoipa-axum = "0.2.0"

[dev-dependencies]
# The document is too large to assert as a literal and too small to describe:
# a snapshot is the only shape that answers "what changed" in a diff. `json` so
# the committed form is the document rather than a `Debug` of it.
insta = { version = "1.48.0", features = ["json"] }
# Reading one field back out of a body a case has already asserted whole, and the
# document back out of the route that serves it.
serde_json = "1.0.151"

[lints]
workspace = true
