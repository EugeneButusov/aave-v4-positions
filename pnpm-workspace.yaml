packages:
  - apps/*
  - packages/*
  # Domain packages nest one level: packages/aave-positions/*. The bare
  # packages/aave-positions directory has no manifest, so pnpm skips it.
  - packages/*/*

# pnpm 10+ requires postinstall scripts to be allow-listed explicitly.
allowBuilds:
  # Fetches its prebuilt binary on install.
  lefthook: true
  # Analytics phone-home, pulled in transitively by @nestjs/swagger. Denied
  # explicitly so it does not prompt on every install.
  '@scarf/scarf': false
  # Reaches the tree only as an optional peer of @nestjs/cli. Builds run through
  # the tsc builder, so nothing here uses it; flip to true if that ever changes.
  '@swc/core': false

# Single source of truth for dependency versions across every workspace package.
# Packages reference these with `"<name>": "catalog:"`.
catalog:
  # Pinned exactly, unlike everything else here. This is a data dependency —
  # contract addresses and ABIs — republished most days as Aave deploys, so a
  # caret range would let the addresses the indexer targets change between two
  # installs of the same commit. 4.61.2 carries byte-identical ISpokeV4 and
  # IHubV4 ABIs and the same Main Spoke and Core Hub as the newest release;
  # bump it deliberately, after re-checking those.
  '@aave-dao/aave-address-book': 4.61.2
  '@clickhouse/client': ^1.23.1
  '@nestjs/common': ^11.1.28
  '@nestjs/config': ^4.0.4
  '@nestjs/core': ^11.1.28
  '@nestjs/platform-express': ^11.1.28
  '@nestjs/swagger': ^11.4.6
  '@nestjs/testing': ^11.1.28
  # OpenTelemetry versions on two tracks, and mixing them up is the usual way
  # to get an unresolvable tree: the stable API, SDK and resource packages are
  # 1.x/2.x, while everything still pre-1.0 — exporters, log SDK,
  # instrumentations — sits on 0.x and is released as a set.
  #
  # `@opentelemetry/api` is the one that must be a SINGLE version in the tree,
  # not merely a compatible range. It registers itself on
  # `globalThis[Symbol.for('opentelemetry.js.api.1')]` and `registerGlobal`
  # refuses on an exact version-string mismatch — so two patch releases of it
  # under pnpm means one silently fails to register and every span it creates
  # is a no-op. The catalog is what prevents that.
  #
  # **No `@opentelemetry/sdk-node`**, deliberately. It is the convenient
  # all-in-one, and it declares 25 dependencies including the OTLP/gRPC
  # exporters — which put `@grpc/grpc-js` at a measured 4.3 MB into the runtime
  # image for a service that exports over HTTP. The providers below are
  # composed by hand in `@packages/telemetry` instead; it is about sixty lines.
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/api-logs': ^0.221.0
  '@opentelemetry/exporter-logs-otlp-proto': ^0.221.0
  '@opentelemetry/exporter-metrics-otlp-proto': ^0.221.0
  '@opentelemetry/exporter-trace-otlp-proto': ^0.221.0
  '@opentelemetry/instrumentation': ^0.221.0
  '@opentelemetry/instrumentation-http': ^0.221.0
  # Instrumentations version independently of the 0.x exporter line.
  '@opentelemetry/instrumentation-nestjs-core': ^0.67.0
  # Supported pino range is `>=5.14.0 <11`; the catalog pins pino at ^10.3.1,
  # so a pino 11 bump would silently drop both correlation and log shipping
  # rather than fail. Check this range when bumping pino.
  '@opentelemetry/instrumentation-pino': ^0.67.0
  '@opentelemetry/instrumentation-undici': ^0.31.0
  '@opentelemetry/resources': ^2.10.0
  '@opentelemetry/sdk-logs': ^0.221.0
  '@opentelemetry/sdk-metrics': ^2.10.0
  '@opentelemetry/sdk-trace-base': ^2.10.0
  '@opentelemetry/sdk-trace-node': ^2.10.0
  '@opentelemetry/semantic-conventions': ^1.43.0
  '@types/supertest': ^7.2.1
  nestjs-pino: ^4.6.1
  pino-http: ^11.0.0
  # postgres.js rather than `pg`: no transitive dependencies against six, and it
  # ships its own types where `pg` needs a separate `@types/pg`. Its tagged
  # templates also make parameterisation the default rather than something a
  # query has to remember — the only string that reaches the server unbound is
  # the DDL in the migration runner, which is a repo file.
  postgres: ^3.4.9
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  supertest: ^7.2.2
  viem: ^2.55.10
  zod: ^4.4.3
