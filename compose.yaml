name: aave-v4-positions

# Ports are overridable so a busy 3000 does not block you:
#   API_PORT=4000 docker compose up
services:
  # 26.3 is the current LTS: it and 25.8 are still being rebuilt while every
  # release between them has gone stale.
  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: aave
      CLICKHOUSE_USER: aave
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aave}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Turns on the server's native Prometheus endpoint on :9363, which is off
      # by default. Deliberately not published to the host — only the collector
      # scrapes it.
      - ./observability/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    ports:
      - '${CLICKHOUSE_PORT:-8123}:8123'
    healthcheck:
      test:
        [
          'CMD',
          'clickhouse-client',
          '--user',
          'aave',
          '--password',
          '${CLICKHOUSE_PASSWORD:-aave}',
          '--query',
          'SELECT 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Where the indexer records where it got to: the cursor and the reorg
  # detector's header window. Tiny — one row and about 129 more per chain — but
  # it is the state that decides whether a restart resumes or re-indexes from
  # INDEXER_START_BLOCK, so it wants a volume of its own.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aave
      POSTGRES_USER: aave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aave}
    volumes:
      # NOT /var/lib/postgresql/data, which is what every pre-18 example says.
      # The 18 image moved PGDATA to a versioned subdirectory so a major upgrade
      # can use pg_upgrade --link, and mounting the old path leaves the database
      # writing outside the volume with nothing logged to say so. It presents as
      # the cursor never surviving a restart — the exact thing this service is
      # here to prevent.
      - postgres-data:/var/lib/postgresql
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aave -d aave']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Runs once and exits. Migrating from the indexer's own boot would have every
  # replica race the same DDL, so the schema is its own step.
  #
  # Two databases, applied in sequence and logged separately, so a failure names
  # which one it was.
  #
  # Its own image, and not a Node one: the schema is applied by `bins/migrate`,
  # which links no chain client and no HTTP server. It shares no layer with the
  # api and indexer images beyond the base — that is the point of it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: 'no'
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: aave
      CLICKHOUSE_USER: aave
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aave}
      POSTGRES_URL: postgres://aave:${POSTGRES_PASSWORD:-aave}@postgres:5432/aave
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api
    init: true
    restart: unless-stopped
    # Must exceed SHUTDOWN_GRACE_SECONDS, or Docker SIGKILLs the container
    # mid-drain and the readiness-first shutdown never completes.
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # One JSON object per line. `docker compose logs | jq` if you want it
      # pretty — turning it on here would change what a deployment emits.
      LOG_PRETTY: 'false'
      SHUTDOWN_GRACE_SECONDS: '5'
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: aave
      CLICKHOUSE_USER: aave
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aave}
      # Read-only from here: the API stamps responses with how far the indexer
      # got, and writes nothing to this database.
      POSTGRES_URL: postgres://aave:${POSTGRES_PASSWORD:-aave}@postgres:5432/aave
      # A known value so `docker compose up` works unconfigured. Set your own in
      # any deployment — a shared key is not a signature — and set the SAME one
      # on every replica.
      POSITIONS_CURSOR_SECRET: ${POSITIONS_CURSOR_SECRET:-local-development-cursor-secret-0000}
      # Read by the SDK preloaded in the CMD, before Nest exists. The service
      # name matches the `service` tag given to LoggingModule, so a log line and
      # a span agree about what produced them.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Without this a fresh stack answers 500s from a view that does not exist
      # yet, for as long as the migration takes.
      migrate:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      # The image has no curl, and adding one purely to run a health check is a
      # poor trade; Node's own fetch is already there.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: indexer
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
      SHUTDOWN_GRACE_SECONDS: '5'
      INDEXER_HOST: 0.0.0.0
      INDEXER_PORT: '3001'
      # Ethereum mainnet against a public endpoint, so `docker compose up`
      # indexes something without any setup. It does mean the stack makes real
      # requests to a third party on start; point RPC_URLS at your own node to
      # avoid that. The list is comma-separated and tried in order.
      CHAIN_ID: '1'
      RPC_URLS: ${RPC_URLS:-https://eth.drpc.org}
      FINALITY_DEPTH: '128'
      # Main Spoke genesis. Only consulted on a cold start: once a cursor row
      # exists this is never read again, so raising it to skip history means
      # clearing the stored cursor too.
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-24720899}
      INDEXER_MAX_RANGE_SIZE: '1000'
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: aave
      CLICKHOUSE_USER: aave
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aave}
      POSTGRES_URL: postgres://aave:${POSTGRES_PASSWORD:-aave}@postgres:5432/aave
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: indexer
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${INDEXER_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Grafana, Prometheus, Tempo, Loki and an OTLP collector in one container.
  #
  # **Up by default, not behind a profile.** `docker compose up` is what a
  # newcomer runs, and a telemetry stack you have to remember to enable is one
  # nobody sees. The cost is stated in the README rather than hidden: ~807 MB on
  # the first pull, and a measured few seconds on a cold start. Skip it with
  # `docker compose up clickhouse postgres migrate api indexer`, or keep it and
  # silence the services with `OTEL_SDK_DISABLED=true docker compose up`.
  #
  # One container rather than a collector plus Prometheus plus Tempo plus Loki,
  # because four containers to look at two services is most of a monitoring
  # stack in a repo whose subject is elsewhere. The trade is that its configs
  # are baked in — hence the pinned tag and the checked-in collector config.
  telemetry:
    image: grafana/otel-lgtm:0.30.0
    restart: unless-stopped
    volumes:
      - ./observability/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - telemetry-data:/data
    environment:
      # Opens on the repo's own dashboard rather than on "add your first data
      # source", which is the difference between a stack that is bootstrapped
      # and one that is merely installed.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/aave-v4.json
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      # 3000 inside is Grafana. NOT mapped to 3000 outside — that is the API's —
      # and not 3100 or 3200 either, which are Loki's and Tempo's ports inside
      # this same container.
      - '${GRAFANA_PORT:-3333}:3000'
      - '${OTLP_HTTP_PORT:-4318}:4318'
    healthcheck:
      # `curl`, not the `node -e "fetch(…)"` the app services use and not the
      # busybox `wget` an Alpine image would have: this one is Ubuntu-based, so
      # it ships curl and neither of the others. Probing the collector's
      # health_check extension rather than Grafana, because the collector is
      # what the services actually export to.
      test: ['CMD', 'curl', '-sf', '-o', '/dev/null', 'http://127.0.0.1:13133/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Postgres has no built-in Prometheus endpoint, unlike ClickHouse, so this is
  # the one exporter the stack needs. 12 MB, and it is what makes connection
  # saturation and lock waits visible — the two ways this deployment's Postgres
  # actually degrades, and neither is something an app-side span can show.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgres://aave:${POSTGRES_PASSWORD:-aave}@postgres:5432/aave?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  clickhouse-data:
  postgres-data:
  telemetry-data:
