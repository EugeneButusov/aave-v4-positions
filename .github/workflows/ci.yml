name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run for it obsolete. main is
# exempt: those runs record whether a merged commit was actually green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The event-store specs run against a real ClickHouse rather than a mock:
    # what they assert is that the SQL executes and that the collapsing
    # semantics behave as documented, neither of which a fake can tell us.
    # CLICKHOUSE_SKIP_USER_SETUP drops the generated password, so the defaults
    # in the vitest config need no secrets.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3-alpine
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Reads the `packageManager` field, so the version can never drift from
      # what contributors run locally.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The single version this project supports; `engines` declares the same,
          # so what CI proves and what install enforces cannot drift apart.
          node-version: '24'
          cache: pnpm

      # --frozen-lockfile fails on a lockfile that does not match package.json
      # rather than silently resolving something else. The `prepare` script also
      # builds the workspace packages here, which lint and typecheck both need.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps rather than `pnpm check`, so a failure names itself in the
      # job summary instead of hiding behind one composite command.
      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Emit is not covered by `pnpm check`: typecheck runs --noEmit, so a fault
      # that only appears when writing output would otherwise reach main.
      - name: Build
        run: pnpm run build
