name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run for it obsolete. main is
# exempt: those runs record whether a merged commit was actually green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The store specs run against real servers rather than mocks: what they
    # assert is that the SQL executes — the collapsing semantics on one side, the
    # upsert-and-prune in a single data-modifying CTE on the other — and neither
    # is something a fake can tell us. CLICKHOUSE_SKIP_USER_SETUP and
    # POSTGRES_HOST_AUTH_METHOD both drop the password, so the defaults in the
    # vitest configs need no secrets.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3-alpine
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Reads the `packageManager` field, so the version can never drift from
      # what contributors run locally.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The single version this project supports; `engines` declares the same,
          # so what CI proves and what install enforces cannot drift apart.
          node-version: '24'
          cache: pnpm

      # --frozen-lockfile fails on a lockfile that does not match package.json
      # rather than silently resolving something else. The `prepare` script also
      # builds the workspace packages here, which lint and typecheck both need.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps rather than `pnpm check`, so a failure names itself in the
      # job summary instead of hiding behind one composite command.
      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Emit is not covered by `pnpm check`: typecheck runs --noEmit, so a fault
      # that only appears when writing output would otherwise reach main.
      - name: Build
        run: pnpm run build

  # Its own job so a failure names itself, and so a cold Rust build does not land
  # on the TypeScript gate's wall clock. No database services: nothing in the
  # workspace talks to one yet. See docs/rust-migration.md.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # No version argument: rustup reads rust-toolchain.toml, the same file a
      # developer's shell reads. This step only makes the install visible in the
      # log instead of hiding it inside the first cargo command.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # Cargo has no inheritance for `[lints]` or `publish`: a member that omits
      # the line is silently exempt, with no warning from anything. The member
      # list comes from cargo rather than a glob, so bins/* is covered the day it
      # exists.
      - name: Manifests inherit the workspace
        run: |
          bad=0
          for manifest in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].manifest_path'); do
            rel="${manifest#"$PWD/"}"
            grep -qxF '[lints]' "$manifest" && grep -qxF 'workspace = true' "$manifest" \
              || { echo "::error file=$rel::missing [lints] / workspace = true"; bad=1; }
            grep -qxF 'publish.workspace = true' "$manifest" \
              || { echo "::error file=$rel::missing publish.workspace = true"; bad=1; }
          done
          exit $bad

      # Nothing in cargo ties the two together, so a bump to one and not the
      # other resolves against a floor the toolchain does not enforce.
      - name: Toolchain pin matches rust-version
        run: |
          pinned=$(grep -oE '^channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          declared=$(grep -oE '^rust-version = "[^"]+"' Cargo.toml | cut -d'"' -f2)
          case "$pinned" in
            "$declared" | "$declared".*) ;;
            *)
              echo "::error file=Cargo.toml::rust-version $declared does not match rust-toolchain.toml channel $pinned"
              exit 1
              ;;
          esac

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Same gap the TypeScript build step covers: clippy stops at `cargo check`,
      # so a codegen or link fault would otherwise reach main.
      - name: Build
        run: cargo build --workspace --release
